<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
    <title>Login</title>
</head>
<body>
    <div class="main-area">
        <h1 id="login-title">LOGIN</h1>
        <img src="person.PNG" alt="person" width="200px" height="200px" style="opacity: 0.8;">
        <div id="error-msg-area">
          <p id="login-error-msg">error username<br>or password</p>
        </div>
        <form id="login-area">
          <input type="text" id="userID" class="login-msg" name="userID" placeholder="UserID">
          <input type="password" id="password" class="login-msg" name="password" placeholder="Password"><br>
          <input type="submit" value="Login" id="login-submit" onmouseover="this.style.backgroundColor='#faebd7';"onmouseout="this.style.backgroundColor='#e8acac'">
          <a href="sign_up.html"><p>還沒有帳號？註冊</p></a>
        </form>
    </div>
</body>
</html>
